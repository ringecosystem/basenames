test = "test"
out = "out"
libs = ["lib"]
remappings = ["@ensdomains/buffer/=lib/buffer"]
fs_permissions = [{access = "read", path = "./script/premint/"}]
evm_version = "london"
sender = "0x0f14341A7f464320319025540E8Fe48Ad0fe5aec"
# eth_rpc_url  = "https://rpc.sepolia.org"
eth_rpc_url  = "https://crab-rpc.darwinia.network"

[rpc_endpoints]
